          data_sent_abroad, sends_marketing_messages]
  must_include: [lk-pdpa-scope, lk-pdpa-privacy-notice, lk-payments-card-gateway,
                 lk-pdpa-marketing-messages, lk-pdpa-cross-border, lk-pdpa-processors]
  must_exclude: [lk-payments-wallet-cards-licence, lk-pdpa-special-categories, lk-pdpa-children]
  not_covered_includes: [Consumer rights, E-commerce and electronic contracts]

