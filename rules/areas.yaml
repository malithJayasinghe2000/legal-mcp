# Legal areas: what the rule library covers, and what it does not.
# Every check result lists both, so "no issues found" is never read as "all clear".

jurisdictions_covered: [LK]

covered:
  personal-data:
    label: Personal data (Personal Data Protection Act)
    gaps: Authority rules and guidelines not collected yet.
  payments:
    label: Payments
    gaps: Lending, crypto, foreign exchange and Central Bank circulars not covered yet.
  ai:
    label: AI features
    gaps: Sri Lanka has no AI law; foreign AI laws (EU AI Act) not covered.
  online-content:
    label: Online content (Online Safety Act)
    gaps: Paid content on declared online locations and user offences not covered.
  consumer:
    label: Consumer rights (Consumer Affairs Authority Act)
    gaps: Authority directions and gazetted price controls not collected yet.
  e-commerce:
    label: E-commerce and electronic contracts (Electronic Transactions Act)
    gaps: Certification Authority rules and Minister's regulations not collected yet.
  cybercrime:
    label: Cybercrime (Computer Crime Act)
    gaps: No Cyber Security Act on Parliament's list (checked 2026-11-13); Sri Lanka CERT guidance and sector security rules not covered.
  copyright:
    label: Copyright (Intellectual Property Act)
    gaps: Trademarks, patents, designs and performers' rights not covered.
  telecom:
    label: Telecommunications (Sri Lanka Telecommunications Act)
    gaps: Mostly about operators. TRCSL rules listing licensed services, the scanned 1991 Act and 1996 amendment not quoted yet; no official text found for SMS opt-out or sender ID rules.
  employment:
    label: Employment (National Minimum Wage of Workers Act)
    gaps: Minimum wage only. Shop and Office Employees Act (hours, leave), EPF, ETF, gratuity, termination and child employment not collected yet.
  regulated-professions:
    label: Regulated professions
    gaps: Doctors and lawyers only. BASL note on online legal advice known only from the press.

not_covered:
  - Trademarks and patents
  - Cyber security (no Act found yet)
  - Education
  - Gambling
  - Crypto and virtual assets
  - Tax
  - Transport
  - Advertising (general)
