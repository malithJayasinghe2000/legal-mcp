id: lk-nmw-minimum-wage
jurisdiction: LK
area: employment
title: Wages must not go below the national minimum wage (Rs. 30,000 a month, Rs. 1,200 a day)
severity: must
triggers:
  all:
    - runs_payroll
    - [users_in:LK, company_in:LK]
why: >
  Since 1 January 2026, no employer in any industry or service may pay a worker less
  than Rs. 30,000 a month or Rs. 1,200 a day. Paying less is an offence, and an employer
  also may not cut other pay or allowances to cancel out the increase. Payroll or
  scheduling software that sets or calculates pay can lead an employer into this.
what_to_do:
  - Check every monthly and daily wage against the minimum, and block or clearly flag anything below it.
  - Keep the minimum amounts as settings, not hard-coded, and check them each year (changed in 2021 and 2025).
  - Don't offer features that cut allowances to cancel out a minimum wage increase.
lawyer_questions:
  - Which pay items count towards the minimum wage for our users' workers (allowances, overtime, commissions)?
  - Is there a newer minimum wage amendment than No. 11 of 2025?
law:
  name: National Minimum Wage of Workers (Amendment) Act, No. 11 of 2025
  section: "s.2, replacing s.3(1) of the National Minimum Wage of Workers Act, No. 3 of 2016"
  source_id: lk-nmw-amendment-2025
  source_url: https://www.parliament.lk/uploads/acts/gbills/english/6388.pdf
  quote: >-
    With effect from January 1, 2026, the national
    minimum monthly wage for all workers in any
    industry or service shall be thirty thousand rupees, and
    the national minimum daily wage of a worker shall be
    one thousand two hundred rupees.
done_check: Check pay below Rs. 30,000 a month or Rs. 1,200 a day is blocked or flagged, and the amounts are current.
in_force: true
starts_on: null
last_checked: 2026-11-18
review_status: draft
reviewed_by: null
notes: >-
  s.3(2) of the 2016 Act forbids paying less; s.9 makes it an offence. s.4 of the 2025 Act forbids
  reducing wages or allowances to negate the increase. The amounts change by amendment: re-check
  Parliament's list each year (find_amendments.py does this monthly).
