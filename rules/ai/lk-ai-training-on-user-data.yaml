id: lk-ai-training-on-user-data
jurisdiction: LK
area: ai
title: Training AI on users' data is a new purpose - tell users and have a legal ground
duty_of: controller
severity: must
triggers:
  all:
    - collects_personal_data
    - trains_ai_on_user_data
    - [users_in:LK, company_in:LK, processing_in:LK]
why: >
  The PDPA allows personal data to be used only for specified, explicit and
  legitimate purposes, and not further processed in a way incompatible with them.
  Data collected to run your service is not automatically allowed for AI training.
what_to_do:
  - Name AI training as a purpose in your privacy notice before you collect the data, with its legal ground.
  - For data already collected, tell users about the new purpose first (Schedule V item 2) and get consent where needed.
  - Prefer anonymised or pseudonymised data for training, and never train on special category data without explicit consent.
lawyer_questions:
  - Is AI training compatible with our original purposes, or do we need fresh consent?
law:
  name: Personal Data Protection Act, No. 9 of 2022
  section: "s.6(1)"
  source_id: lk-pdpa-2022
  source_url: https://www.parliament.lk/uploads/acts/gbills/english/6242.pdf
  quote: >-
    Every controller shall, ensure that personal data is processed for a- (a) specified;
    (b) explicit; and (c) legitimate, purposes and such personal data shall not be
    further processed in a manner which is incompatible with such purposes.
in_force: false
starts_on: 2027-01-01
last_checked: 2026-11-11
review_status: draft
reviewed_by: null
notes: "s.6(2) allows further processing for research and statistics, subject to s.10."
