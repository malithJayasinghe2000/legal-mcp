id: lk-cca-access-credentials
jurisdiction: LK
area: cybercrime
title: Never disclose passwords, API keys or access codes you are trusted with
severity: must
triggers:
  all:
    - accesses_other_systems
    - [users_in:LK, company_in:LK, processing_in:LK]
why: >
  A person trusted with information that gives access to a computer service (passwords,
  tokens, API keys) who discloses it without express authority or against a contract
  commits a crime. If your product stores users' logins or keys to other services, a
  leak or careless sharing by staff can fall under this.
what_to_do:
  - Store credentials and tokens encrypted, and limit which staff can see them.
  - Prefer OAuth or tokens over storing users' passwords.
  - Never share them with partners unless the user expressly allowed it.
lawyer_questions:
  - Do our contracts with staff and partners cover handling of users' access details?
law:
  name: Computer Crime Act, No. 24 of 2007
  source_id: lk-cca-2007
  source_url: https://www.parliament.lk/uploads/acts/gbills/english/4684.pdf
  section: "s.10"
  quote: >-
    Any person who, being entrusted with information which enables him to access any
    service provided by means of a computer, discloses such information without any
    express authority to do so or in breach of any contract expressed or implied,
    shall be guilty of an offence
done_check: Check stored credentials are encrypted, access is limited, and none are shared.
in_force: true
starts_on: null
last_checked: 2026-11-13
review_status: draft
reviewed_by: null
notes: ""
