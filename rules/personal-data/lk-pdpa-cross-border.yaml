id: lk-pdpa-cross-border
jurisdiction: LK
area: personal-data
title: Sending personal data abroad (foreign cloud or AI API) needs safeguards
severity: must
triggers:
  all:
    - collects_personal_data
    - [users_in:LK, company_in:LK, processing_in:LK]
    - data_sent_abroad
why: >
  Personal data may leave Sri Lanka only if you keep meeting the PDPA's duties for
  it, using the instruments the Authority specifies to bind the foreign recipient,
  or under an exception such as explicit informed consent or necessity for a
  contract with the person.
what_to_do:
  - List every service outside Sri Lanka that receives personal data (cloud regions, AI APIs, analytics).
  - Use binding contract terms with each recipient (watch for the Authority's directive on which instruments).
  - Mention transfers abroad in your privacy notice (Schedule V item (h)).
lawyer_questions:
  - Has the Authority issued the directive under s.33(c) on transfer instruments yet?
  - Can we rely on the contract exception in s.26(3)(b) for our core service?
law:
  name: Personal Data Protection (Amendment) Act, No. 22 of 2025
  section: "s.26(1) of the PDPA, as replaced by s.10 of Act No. 22 of 2025"
  source_id: lk-pdpa-amendment-2025
  source_url: https://www.parliament.lk/uploads/acts/gbills/english/6384.pdf
  quote: >-
    A controller or processor may engage in cross-border data flows, only where such
    controller or processor, ensures compliance with the provisions of Part I, Part II
    and sections 20, 21, 22, 23, 24 and 25, as the case may be.
in_force: false
starts_on: 2027-01-01
last_checked: 2026-11-11
review_status: draft
reviewed_by: null
notes: >
  The 2025 amendment removed the old "adequacy decision" system. Public authorities
  have extra limits (s.26(4)). Whether s.26 is in the 2027 start order (Part III) is
  from secondary sources only.
