id: lk-pdpa-retention
jurisdiction: LK
area: personal-data
title: Don't keep personal data longer than needed
duty_of: controller
severity: must
triggers:
  all:
    - collects_personal_data
    - [users_in:LK, company_in:LK, processing_in:LK]
why: >
  The PDPA allows keeping identifiable data only as long as the purpose needs it.
what_to_do:
  - Set a retention period for each kind of data and state it in your privacy notice.
  - Build automatic deletion or anonymisation when the period ends (including backups and logs).
lawyer_questions:
  - Do other laws (tax, banking, medical records) require us to keep some data longer?
law:
  name: Personal Data Protection Act, No. 9 of 2022
  section: "s.9"
  source_id: lk-pdpa-2022
  source_url: https://www.parliament.lk/uploads/acts/gbills/english/6242.pdf
  quote: >-
    Every controller shall ensure that personal data that is being processed shall be
    kept in a form which permits identification of data subjects only for such period
    as may be necessary or required for the purposes for which such personal data is
    processed
done_check: Check deletion really runs, including backups and logs.
in_force: false
starts_on: 2027-01-01
last_checked: 2026-11-11
review_status: draft
reviewed_by: null
notes: ""
