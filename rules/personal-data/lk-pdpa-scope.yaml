id: lk-pdpa-scope
jurisdiction: LK
area: personal-data
title: Sri Lanka's Personal Data Protection Act applies to this product
severity: must
triggers:
  all:
    - collects_personal_data
    - [users_in:LK, company_in:LK, processing_in:LK]
why: >
  The product handles personal data and either has users in Sri Lanka, is run by
  a Sri Lankan company or person, or processes data in Sri Lanka. Any one of these
  brings it under the PDPA, even if the other two are abroad.
what_to_do:
  - Plan for the PDPA now. Its core duties (Part I and Part III) start on 1 January 2027.
  - Write down what personal data you collect, why, where it is stored and who you share it with.
  - Check the other personal data warnings in this report; they all come from this Act.
lawyer_questions:
  - Are we a "controller" or a "processor" for this data, or both?
  - Has the Data Protection Authority issued rules or guidelines that apply to our sector?
law:
  name: Personal Data Protection Act, No. 9 of 2022
  section: "s.2(1)"
  source_id: lk-pdpa-2022
  source_url: https://www.parliament.lk/uploads/acts/gbills/english/6242.pdf
  quote: >-
    This Act shall apply to the processing of personal data- (a) where the processing
    of personal data takes place wholly or partly within Sri Lanka; or (b) where the
    processing of personal data is carried out by a controller or processor who- (i) is
    domiciled or ordinarily resident in Sri Lanka; (ii) is incorporated or established
    under any written law of Sri Lanka; (iii) offers goods or services to data subjects
    in Sri Lanka including the offering of goods or services with specific targeting of
    data subjects in Sri Lanka; or
in_force: false
starts_on: 2027-01-01
last_checked: 2026-11-11
review_status: draft
reviewed_by: null
notes: >
  Start date (s.2-3, Part I, Part III from 1 January 2027) is from secondary sources
  about Gazette No. 2498/16; the Gazette itself is not seen yet. Penalties (Part VII)
  have no start date yet.
