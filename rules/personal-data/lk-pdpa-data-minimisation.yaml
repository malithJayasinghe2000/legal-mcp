id: lk-pdpa-data-minimisation
jurisdiction: LK
area: personal-data
title: Collect only the personal data you need
duty_of: controller
severity: must
triggers:
  all:
    - collects_personal_data
    - [users_in:LK, company_in:LK, processing_in:LK]
why: >
  The PDPA requires personal data to be adequate, relevant and proportionate to
  the purpose. Extra "nice to have" fields are a legal risk.
what_to_do:
  - For each form field and stored attribute, note the purpose. Remove what has none.
  - Make optional fields clearly optional.
lawyer_questions: []
law:
  name: Personal Data Protection Act, No. 9 of 2022
  section: "s.7"
  source_id: lk-pdpa-2022
  source_url: https://www.parliament.lk/uploads/acts/gbills/english/6242.pdf
  quote: >-
    Every controller shall ensure that personal data that is processed shall be- (a)
    adequate; (b) relevant; and (c) proportionate, to the extent as is necessary in
    relation to the purpose for which such data shall be collected or processed.
in_force: false
starts_on: 2027-01-01
last_checked: 2026-11-11
review_status: draft
reviewed_by: null
notes: "Related: s.6 purpose limitation, s.8 accuracy."
