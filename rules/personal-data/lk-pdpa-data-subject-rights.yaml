id: lk-pdpa-data-subject-rights
jurisdiction: LK
area: personal-data
title: Users can ask to see, correct or delete their data - answer within one month
severity: must
triggers:
  all:
    - collects_personal_data
    - [users_in:LK, company_in:LK, processing_in:LK]
why: >
  The PDPA gives people rights to access, withdraw consent, object, correct, erase
  and ask for review of automated decisions. You must reply in writing within one
  month (extendable, with notice) and, as a rule, free of charge.
what_to_do:
  - Build a simple way to receive and track these requests (and verify who is asking).
  - Make sure you can export, correct and fully delete one user's data.
  - When refusing, give reasons and tell the user they can appeal to the Authority.
lawyer_questions:
  - When may we refuse a request under s.17(2)?
law:
  name: Personal Data Protection (Amendment) Act, No. 22 of 2025
  section: "s.17(1) of the PDPA, as replaced by s.4 of Act No. 22 of 2025; rights in s.13-16 and s.18"
  source_id: lk-pdpa-amendment-2025
  source_url: https://www.parliament.lk/uploads/acts/gbills/english/6384.pdf
  quote: >-
    Where a controller receives a written request from a data subject under section
    13, 14, 15, 16 or 18, such controller shall inform in writing to the data subject,
    without undue delay and within one month of the receipt of such request, whether-
done_check: Check you can export, correct and delete one user's data and answer within one month.
in_force: false
starts_on: null
last_checked: 2026-11-11
review_status: draft
reviewed_by: null
notes: "Part II (rights) has no start date yet. Original s.17 said twenty-one working days."
