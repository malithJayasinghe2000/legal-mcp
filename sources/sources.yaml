# Official law sources for the first 5 areas (ROADMAP Phase 1, Step 1).
#
# One entry per document. `url` is the official copy we use; `alt_urls` are
# tried in order if it fails. Download with:
#   uv run --group sources python scripts/fetch_sources.py
# Results (date, sha256) go to sources/fetched.json. Files go to sources/raw/ (not in git).
#
# `verified`: what was confirmed by opening the downloaded document itself
# (title, number, date as printed), and when. Anything without it is still a lead.
#
# `url` must be an OFFICIAL copy (brief D14): parliament.lk (Acts and
# amendments), CommonLII (government 1980 revised text of old laws, by hand),
# the regulator itself (cbsl.gov.lk, dpa.gov.lk, slmc.gov.lk, supremecourt.lk),
# lawnet.gov.lk, documents.gov.lk. Rules quote and link only these.
# `research_copy` = private site copy, for reading only (not downloaded, never
# quoted or linked in a rule).
# Note (2026-11-11): documents.gov.lk was rebuilt as a JavaScript app and its old
# /view/... PDF links now return 404, so we don't rely on it.
# `url: null` + `manual:` = no official copy found yet; see note.
# `manual_download: true` = official copy exists but blocks scripts; download it in
# a browser and save as sources/raw/<id>.pdf (fetch_sources.py then records its hash).

