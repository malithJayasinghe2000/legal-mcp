# ---------- 3. AI features ----------
# Sri Lanka has no AI-specific law (as of 2026-11-11). AI rules come from the
# PDPA (automated decisions, profiling), the professional rules (AI giving legal
# or medical advice) and the Online Safety Act. No separate source needed yet.

