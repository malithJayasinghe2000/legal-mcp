name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: MCP server and rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # The law PDFs are not in git (sources/raw). Download them so every rule's quote
      # is checked word for word against the official text. Cached by sources.yaml.
      - uses: actions/cache@v4
        with:
          path: sources/raw
          key: law-sources-${{ hashFiles('sources/sources.yaml') }}
      - name: Download official law sources
        run: uv run --group sources python scripts/fetch_sources.py || echo "Some sources could not be downloaded; their quote tests will be skipped."

      - name: Tests
        run: uv run pytest -rs

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
